name: Fix package rename and self-destruct

on:
  push:
    branches:
      - change-name

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename Room schema folders to new package
        run: |
          OLD_APP="app/schemas/io.github.aedev.flow.data.local.AppDatabase"
          NEW_APP="app/schemas/com.arubr.smsvcodes.data.local.AppDatabase"
          OLD_LINK="app/schemas/io.github.aedev.flow.sync2.data.LinkedDatabase"
          NEW_LINK="app/schemas/com.arubr.smsvcodes.sync2.data.LinkedDatabase"

          if [ -d "$OLD_APP" ]; then
            git mv "$OLD_APP" "$NEW_APP"
            echo "Renamed AppDatabase schema folder"
          else
            echo "AppDatabase schema folder already renamed or missing, skipping"
          fi

          if [ -d "$OLD_LINK" ]; then
            git mv "$OLD_LINK" "$NEW_LINK"
            echo "Renamed LinkedDatabase schema folder"
          else
            echo "LinkedDatabase schema folder already renamed or missing, skipping"
          fi

      - name: Verify nothing still declares the old package
        run: |
          OLD_PKG="io.github.aedev.flow"
          echo "Searching for leftover references to ${OLD_PKG} ..."
          MATCHES=$(grep -rn \
            --include="*.kt" --include="*.java" \
            --include="*.gradle" --include="*.gradle.kts" \
            --include="AndroidManifest.xml" \
            "$OLD_PKG" . || true)

          if [ -n "$MATCHES" ]; then
            {
              echo "## ⚠️ Leftover references to old package (${OLD_PKG})"
              echo '```'
              echo "$MATCHES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Found leftover references to old package name. See job summary for details."
            exit 1
          fi

          echo "No leftover references to ${OLD_PKG} found." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove this workflow file
        if: always()
        run: git rm -f .github/workflows/package-rename-fixup.yml

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rename Room schema folders to new package + remove one-off fixup workflow"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Nothing to commit"
          fi
