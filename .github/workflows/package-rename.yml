name: One-time package rename
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/package-rename.yml"
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: change-name
          fetch-depth: 0
      - name: Replace package name
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          old = "io.github.aedev.flow"
          new = "com.arubr.smsvcodes"

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for path in filter(None, tracked):
              if path.startswith(".github/workflows/") or not os.path.isfile(path):
                  continue
              try:
                  with open(path, "rb") as f:
                      data = f.read()
                  text = data.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old, new)
              if updated != text:
                  with open(path, "w", encoding="utf-8", newline="") as f:
                      f.write(updated)
          PY
      - name: Commit all replacements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes found."
            exit 0
          fi
          git commit -m "Change package name to com.arubr.smsvcodes without moving file tree"
          git push origin HEAD:change-name
